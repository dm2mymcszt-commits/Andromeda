name: Build TrollStore package

on:
  workflow_dispatch:
  push:
    branches: [experiment/route-motion]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  icon-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render icon comparison without changing app assets
        run: |
          npm ci --prefix Design/Icon --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install -r Design/Icon/requirements.txt
          node Design/Icon/render.cjs
          "$RUNNER_TEMP/icon-env/bin/python" Design/Icon/compare.py
          cp Design/Icon/output/render.sha256 "$RUNNER_TEMP/first-render.sha256"
          node Design/Icon/render.cjs
          "$RUNNER_TEMP/icon-env/bin/python" Design/Icon/compare.py
          cmp "$RUNNER_TEMP/first-render.sha256" Design/Icon/output/render.sha256
          git diff --exit-code -- TrollRoute/Assets.xcassets
      - name: Upload icon approval comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icon-approval-${{ github.sha }}
          path: Design/Icon/output/
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      THEOS: ${{ github.workspace }}/.theos-toolchain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Set up Theos and RootHelper SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS14.5.sdk
          git -C "$RUNNER_TEMP/theos-sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS14.5.sdk" "$THEOS/sdks/"

      - name: Check app identity
        run: python3 Tests/Identity/check.py

      - name: Package version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' TrollRoute/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          set -o pipefail
          bash ipabuild.sh 2>&1 | tee "$RUNNER_TEMP/trollstore-build.log"
          test -s build/TrollRoute.tipa
          unzip -t build/TrollRoute.tipa
          python3 Tests/Identity/check.py build/TrollRoute.tipa

      - name: Check read-only data migration
        run: bash Tests/Migration/check.sh

      - name: Check simulated motion metadata
        run: bash Tests/RouteMotion/check-location.sh

      - name: Check route calculation and movement
        run: bash Tests/RouteSimulation/check.sh

      - name: Check saved altitude, motion preservation, and worldwide elevation
        run: bash Tests/Altitude/check.sh

      - name: Check safe map moves and confirmation
        run: bash Tests/MapMoveSafety/check.sh

      - name: Check location parsers and seven worldwide addresses
        run: bash Tests/AddressSearch/check.sh

      - name: Check shared places and route endpoint handoff
        run: bash Tests/SharedPlace/check.sh

      - name: Check route map and capture previews
        run: bash Tests/RouteMap/check.sh

      - name: Upload route map previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-map-preview-${{ github.run_id }}
          path: build/route-map-qa/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TrollStore package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrollRoute-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: build/TrollRoute.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Check map workspace and capture previews
        run: bash Tests/MapWorkspace/check.sh

      - name: Upload map workspace previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: map-workspace-preview
          path: build/map-workspace-qa/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trollstore-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Check route picker and capture preview
        run: bash Tests/RoutePicker/check.sh

      - name: Upload route picker preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-picker-preview-${{ github.run_id }}
          path: build/route-picker-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
